[project]
name = "infradeck"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.119,<1",
    "uvicorn>=0.37,<1",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=25,<26",
    "cryptography>=50,<51",
    "jwcrypto>=1.5,<2",
    "asyncssh>=2.21,<3",
    "aiogram>=3.22,<4",
    "aiohttp-socks>=0.10,<1",
    "pydantic-settings>=2.11,<3",
    "dnspython>=2.8,<3",
]
[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "httpx>=0.28,<1",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "types-jwcrypto",
    "coverage>=7.10,<8",
    "pip-audit>=2.10.1",
]
[tool.pytest.ini_options]
pythonpath = ["services/control-plane/src"]
testpaths = ["services/control-plane/tests"]
[tool.coverage.run]
branch = true
source = ["services/control-plane/src/infradeck"]
[tool.coverage.report]
show_missing = true
fail_under = 90
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services/control-plane/src"
[[tool.mypy.overrides]]
module = ["jwcrypto.*"]
ignore_missing_imports = true
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["services/control-plane/src/infradeck"]
