name: Pull request checks
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/check_repository.py --branch-policy
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: make check
      - run: docker compose -p infradeck-validation -f deploy/compose.dev.yaml config -q
      - run: sh -n scripts/e2e.sh
      - name: Validate private proxy template
        env:
          INFRADECK_SSH_IMAGE: ssh-client:validation-only
          INFRADECK_SQUID_ADDRESS: private-squid.example
          INFRADECK_PROXY_SSH_TARGET: restricted@proxy.example
          INFRADECK_PROXY_KEY_FILE: /tmp/infradeck-fixture-key
          INFRADECK_PROXY_KNOWN_HOSTS_FILE: /tmp/infradeck-fixture-hosts
        run: docker compose -p infradeck-validation -f deploy/proxy.yaml config -q
  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck=""
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: infradeck
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: infradeck_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U infradeck -d infradeck_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://infradeck:local-only@localhost:5432/infradeck_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: pipx install --force uv==0.13.6
      - run: uv sync --frozen
      - run: uv run python scripts/dev_keys.py
      - run: uv run ruff check services/control-plane/src
      - run: uv run ruff format --check services/control-plane/src
      - run: uv run mypy services/control-plane/src
      - run: uv export --no-dev --no-emit-project --no-hashes -o .runtime/requirements.txt
      - run: uv run pip-audit --disable-pip --no-deps -r .runtime/requirements.txt
      - run: uv run pytest --cov=infradeck --cov-report=json:.runtime/backend-coverage.json
      - run: uv run python scripts/check_coverage.py .runtime/backend-coverage.json
      - run: uv run python scripts/export_openapi.py && git diff --exit-code -- contracts/openapi.json
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run generate && git diff --exit-code -- apps/web/src/shared/api/schema.d.ts
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run verify-build
      - run: npm --prefix apps/web audit --audit-level=high
  e2e:
    name: Cypress integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: infradeck
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: infradeck_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U infradeck -d infradeck_e2e"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql://infradeck:local-only@localhost:5432/infradeck_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: pipx install --force uv==0.13.6
      - run: uv sync --frozen
      - run: uv run python scripts/dev_keys.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - run: npm ci --prefix apps/web
      - run: scripts/e2e.sh
  production-smoke:
    name: Production container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash -n deploy/release.sh deploy/configure-https.sh deploy/configure-egress.sh scripts/production-smoke.sh
      - run: sh -n deploy/init-db.sh
      - run: scripts/production-smoke.sh
  gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [branch-policy, repository, workflows, backend, frontend, e2e, production-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every dependency to succeed
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = {'branch-policy', 'repository', 'workflows', 'backend', 'frontend', 'e2e', 'production-smoke'}
          if set(results) != expected or any(job['result'] != 'success' for job in results.values()):
              raise SystemExit('Required checks did not all succeed')
          PYTHON
